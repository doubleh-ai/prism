<!doctype html>
<html lang="zh-CN" class="light">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prism · 引导布局验证</title>
<link rel="stylesheet" href="/static/css/app.css">
<style>
body { overflow:auto; padding:24px; min-height:150vh; }
h1 { font-size:24px; margin-bottom:12px; }
.fixture-actions { display:flex; flex-wrap:wrap; gap:12px; }
.fixture-actions button { padding:12px; border:1px solid var(--border); border-radius:8px; color:var(--text); background:var(--bg2); }
.fixture-composer { position:fixed; bottom:36px; left:15%; width:70%; padding:20px; border:1px solid var(--border); border-radius:16px; background:var(--bg); }
.fixture-composer p { margin-bottom:16px; }
#modelSelect { width:200px; max-width:100%; height:40px; border-radius:8px; padding:8px; background:var(--bg2); color:var(--text); }
</style>
<h1>Prism 引导布局验证</h1>
<p>仅加载实际引导脚本和样式。无账号、无网络数据、无模型调用。</p>
<div class="fixture-actions">
  <button onclick="openTour(false)">模型选择引导</button>
  <button onclick="openTour(true)">长说明引导</button>
  <button onclick="App._startTour('analysis')">个股分析引导</button>
</div>
<div id="sidebarVibe" style="display:none"><button class="analysis-run-btn">历史研究入口</button></div>
<div id="sidebarAnalysis"><input id="analysisQ" aria-label="搜索股票" placeholder="搜索股票"><button class="analysis-run-btn">一键分析</button></div>
<div class="fixture-composer"><p>提出研究问题，也可以查询行情、比较产业关系或查看历史研报。</p><select id="modelSelect"><option>DeepSeek V4 Pro</option></select></div>
<script>
var App = {_loadPrefs: function() { return {}; }, _savePrefs: function() {}};
function esc(text) { return String(text).replace(/[&<>"']/g, function(c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function openTour(long) {
  var text = '下拉切换 AI 模型（DeepSeek / MiniMax 等）。';
  App._tourStepsActive = [
    {sel:'#modelSelect',title:'对话',text:text},
    {sel:'#modelSelect',title:'输入框',text:text},
    {sel:'#modelSelect',title:'模型选择',text:long ? text.repeat(60) : text},
    {sel:'#modelSelect',title:'工具管理',text:text},
    {sel:null,title:'就这样！',text:'随时可以重新查看指引。'}
  ];
  App._tourIdx = 2;
  App._renderTourStep();
}
</script>
<script src="/static/js/app.tour.js"></script>
</html>
