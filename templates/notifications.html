<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="same-origin">
  <title>站内提醒 · Work</title>
  <link rel="icon" type="image/svg+xml" href="/static/prism-mark.svg?v=98">
  <link rel="stylesheet" href="/static/css/work.css?v=98">
  <link rel="stylesheet" href="/static/css/projects.css?v=98">
  <script src="/static/js/notifications.js?v=98" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">跳至提醒</a>
  <div class="work-shell">
    <aside class="work-sidebar" aria-label="工作区导航">
      <a class="work-brand" href="/work"><span class="brand-mark"><svg width="24" height="24" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true" focusable="false"><use href="/static/prism-mark.svg?v=98#mark"/></svg></span><span>Work<span class="brand-caption">我的工作台</span></span></a>
      <nav class="project-nav" aria-label="工作导航"><a href="/projects">项目</a><a href="/work">我的任务</a><a href="/calendar">日历安排</a><a href="/notifications" aria-current="page">提醒</a></nav>
      <div class="project-sidebar-bottom"><a href="/prism?feedback=notifications">反馈与建议</a><a href="/">DoubleH</a></div>
    </aside>
    <main class="work-main project-main" id="main">
      <header class="work-header"><h1>站内提醒</h1><button class="button button-secondary" type="button" id="refresh">刷新</button></header>
      <p class="project-account" id="account"></p>
      <details><summary>提醒说明</summary><p class="fine-print">任务截止或日程开始前 15 分钟；邮件与设备推送未启用。</p></details>
      <div class="work-notice" id="notice" role="status" aria-live="polite" hidden></div>
      <p id="loginPrompt" hidden>登录已失效，请<a href="/login">重新登录</a>。</p>
      <section class="project-section" id="content" hidden aria-label="提醒列表"><div id="list"></div><p class="empty-state" id="empty" hidden>暂无提醒。</p></section>
    </main>
  </div>
</body>
</html>
