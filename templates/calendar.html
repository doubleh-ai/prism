<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="same-origin"><title>日历安排 · Prism</title><link rel="icon" type="image/svg+xml" sizes="any" href="/static/prism-mark.svg?v=93"><link rel="stylesheet" href="/static/css/desk.css?v=93"><script src="/static/js/app.work.js?v=93" defer></script><script src="/static/js/app.hub.js?v=93" defer></script></head><body data-page="calendar"><a class="skip" href="#main">跳至内容</a><aside class="rail"><a class="brand" href="/"><svg width="0.8em" height="0.8em" viewBox="0 0 32 32" fill="var(--accent)" aria-hidden="true" focusable="false"><use href="/static/prism-mark.svg?v=93#mark"/></svg> Prism<span>RESEARCH & WORK</span></a><nav aria-label="平台导航"><a href="/">研究对话</a><a href="/futures">期货研究</a><a href="/work">我的任务</a><a href="/calendar">日历安排</a><a href="/preferences">研究偏好</a><a href="/?feedback=calendar">反馈与进度 ↗</a></nav><p>清晰地研究，从容地推进。</p></aside><main id="main"><header><span class="eyebrow">PRISM / CALENDAR</span><h1>日历安排</h1><p>给重要的事，留出明确的时间。</p></header><p id="notice" class="notice" role="status" aria-live="polite" hidden></p><section class="card"><div class="actions"><label>查看日期<input id="calendarDay" type="date" required></label><button id="calendarLoad" type="button">查看这一周</button><span id="calendarZone" class="muted"></span></div><div id="calendarList" class="agenda" aria-live="polite"></div></section><section class="card"><h2 id="eventHeading">安排一件事</h2><form id="eventForm" class="form-grid"><label class="wide">日程标题<input name="title" maxlength="200" required placeholder="例如：项目方案评审"></label><label>开始<input name="start" aria-label="开始" type="datetime-local" required><select name="startFold" aria-label="选择开始时间的时区偏移" hidden></select></label><label>结束<input name="end" aria-label="结束" type="datetime-local" required><select name="endFold" aria-label="选择结束时间的时区偏移" hidden></select></label><label class="wide">说明<textarea name="description" maxlength="4000" rows="3"></textarea></label><div class="wide actions"><button type="submit">保存日程</button><button id="eventNew" type="button" class="secondary">新建另一条</button></div><p class="wide muted">时间按上方本设备时区保存，可在其他设备继续编辑。支持单次日程与 ICS 导出；重复日程、邮件/系统推送尚未启用。</p></form></section></main></body></html>
