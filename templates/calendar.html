<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="same-origin"><title>日历安排 · Work</title><link rel="icon" type="image/svg+xml" sizes="any" href="/static/prism-mark.svg?v=97"><link rel="stylesheet" href="/static/css/desk.css?v=97"><script src="/static/js/app.work.js?v=97" defer></script><script src="/static/js/app.hub.js?v=97" defer></script></head><body data-page="calendar"><a class="skip" href="#main">跳至内容</a><aside class="rail"><a class="brand" href="/work">Work</a><nav aria-label="工作导航"><a href="/projects">项目</a><a href="/work">我的任务</a><a href="/calendar">日历安排</a><a href="/notifications">提醒</a></nav><div class="rail-footer"><a href="/prism?feedback=calendar">反馈与建议</a><a href="/">DoubleH</a></div></aside><main id="main"><header><h1>日历安排</h1></header><p id="notice" class="notice" role="status" aria-live="polite" hidden></p><section class="card"><div class="actions"><label>查看日期<input id="calendarDay" type="date" required></label><button id="calendarLoad" type="button">查看这一周</button><span id="calendarZone" class="muted"></span></div><div id="calendarList" class="agenda" aria-live="polite"></div></section><section class="card"><h2 id="eventHeading">安排一件事</h2><form id="eventForm" class="form-grid"><label class="wide">日程标题<input name="title" maxlength="200" required placeholder="例如：项目方案评审"></label><label>开始<input name="start" aria-label="开始" type="datetime-local" required><select name="startFold" aria-label="选择开始时间的时区偏移" hidden></select></label><label>结束<input name="end" aria-label="结束" type="datetime-local" required><select name="endFold" aria-label="选择结束时间的时区偏移" hidden></select></label><label class="wide">说明<textarea name="description" maxlength="4000" rows="3"></textarea></label><div class="wide actions"><button type="submit">保存日程</button><button id="eventNew" type="button" class="secondary">新建日程</button></div><p class="wide muted">日程按上方时区保存。</p></form></section></main></body></html>
