<!DOCTYPE html>
<html lang="zh-CN" class="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Prism — AI 投资分析</title>
<link rel="stylesheet" href="/static/css/app.css?v=34">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='g' x1='0%' y1='0%' x2='100%' y2='100%'><stop offset='0%' stop-color='%233b5d8a'/><stop offset='100%' stop-color='%236b95c8'/></linearGradient></defs><rect width='32' height='32' rx='7' fill='%231c1a16'/><circle cx='16' cy='16' r='9' fill='none' stroke='url(%23g)' stroke-width='1.8'/><circle cx='16' cy='16' r='3.5' fill='url(%23g)' opacity='.9'/></svg>">
</head><body>

<div class="app-shell" id="appShell">
  <nav class="icon-rail" id="iconRail">
    <div class="icon-rail-brand" title="Prism">
      <svg viewBox="0 0 32 32" width="24" height="24" aria-hidden="true"><circle cx="16" cy="16" r="11" fill="none" stroke="currentColor" stroke-width="1.6" opacity=".4"/><circle cx="16" cy="16" r="4" fill="currentColor"/></svg>
    </div>
    <button class="icon-rail-btn active" data-mode="chat" title="对话" onclick="App.switchMode('chat')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4 5h16v10H8l-4 4V5z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
    </button>
    <button class="icon-rail-btn" data-mode="market" title="行情" onclick="App.switchMode('market')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4 19V5m0 14h16M8 16l3-4 3 2 4-6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="icon-rail-btn" data-mode="analysis" title="分析" onclick="App.switchMode('analysis')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="3" fill="currentColor"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    </button>
    <button class="icon-rail-btn" data-mode="industry" title="图谱" onclick="App.switchMode('industry')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="6" cy="6" r="2.4" fill="currentColor"/><circle cx="18" cy="6" r="2.4" fill="currentColor"/><circle cx="12" cy="18" r="2.4" fill="currentColor"/><path d="M6 8.4v3.6l6 3.6M18 8.4v3.6l-6 3.6M8 6h8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    </button>
  </nav>
  <aside class="sidebar">
    <div class="sidebar-head">
      <span class="logo">Prism</span><span class="dot"></span>
    </div>
    <!-- chat-mode sidebar -->
    <button class="new-chat-btn" onclick="App.newConv()"><span>+ 新分析</span></button>
    <div class="bulk-bar" id="bulkBar"></div>
    <div class="conv-list" id="convList"><div class="conv-empty">暂无分析</div></div>
    <!-- market-mode sidebar -->
    <div class="sidebar-market" id="sidebarMarket" style="display:none">
      <p class="sidebar-mode-title">行情看板</p>
      <div class="market-search-wrap">
        <input type="text" id="marketSidebarQ" placeholder="搜索代码 / 名称（如 600519 / 茅台）" autocomplete="off" class="market-q-input">
      </div>
      <div class="market-sidebar-results" id="marketSidebarResults"></div>
      <div class="watchlist-head"><span>自选</span><span class="watchlist-count" id="watchlistCount"></span></div>
      <div class="watchlist" id="watchlist"></div>
      <div class="indicator-block">
        <div class="sidebar-mode-title">指标库 <span class="ind-hint">自然语言 → 可执行指标</span></div>
        <div class="market-search-wrap ind-input-wrap">
          <input type="text" id="indicatorInput" placeholder="如 MACD金叉 / 5日线上穿20日线且放量2倍" autocomplete="off" class="market-q-input">
          <button class="ind-go" onclick="App._translateIndicator()">翻译</button>
        </div>
        <div class="indicator-preview" id="indicatorPreview"></div>
        <div class="indicator-list" id="indicatorList"></div>
      </div>
    </div>
    <!-- analysis-mode sidebar -->
    <div class="sidebar-analysis" id="sidebarAnalysis" style="flex:1;flex-direction:column;min-height:0;padding:0 var(--sp-12) var(--sp-8);overflow:hidden;display:none">
      <p class="sidebar-mode-title">选股 + 一键生成分析报告</p>
      <div class="market-search-wrap">
        <input type="text" id="analysisQ" placeholder="输入代码或名称…" autocomplete="off" class="market-q-input">
      </div>
      <div class="market-sidebar-results" id="analysisSearchResults"></div>
      <button class="analysis-run-btn" onclick="App._runAnalysis()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" style="flex-shrink:0"><path d="M12 2a10 10 0 1010 10A10 10 0 0012 2zm4.5 10.5l-6 3.5v-7l6 3.5z" fill="currentColor"/></svg>
        <span>一键分析</span>
      </button>
      <div style="flex:1;overflow-y:auto;font-size:11px;color:var(--side-text);padding:4px 0" id="analysisStatus"></div>
    </div>
    <!-- industry-mode sidebar -->
    <div class="sidebar-industry" id="sidebarIndustry" style="flex:1;flex-direction:column;min-height:0;padding:0 var(--sp-12) var(--sp-8);overflow:hidden;display:none">
      <p class="sidebar-mode-title">产业链图谱</p>
      <div style="flex:1;overflow-y:auto" id="industrySidebarList"></div>
    </div>
    <div class="sidebar-foot">
      <span class="foot-user-name" id="userBadge"></span>
      <span class="conv-badge" id="convBadge"></span>
      <span class="foot-ver" id="versionTag">v0.13.15</span>
      <a class="trash-link" id="trashLink" onclick="App.openTrash()" style="display:none" title="回收站">🗑</a>
      <a class="trash-link" id="graphLink" onclick="App.openGraph()" style="display:none" title="分析关系图">📊</a>
      <button class="logout-link" onclick="App.logout()">退出</button>
    </div>
  </aside>

  <main class="main">
    <div class="loading-bar" id="loadingBar"></div>
    <div class="topbar">
      <button class="tb" onclick="document.getElementById('appShell').classList.toggle('collapsed')" title="折叠侧边栏"><svg width="15" height="15" viewBox="0 0 15 15" fill="none"><path d="M2 3.5h11M2 7.5h11M2 11.5h11" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></button>
      <span class="sep"></span>
      <button class="tb" onclick="App.toggleWidth()" title="宽窄切换"><svg width="15" height="15" viewBox="0 0 15 15" fill="none"><path d="M2 4.5l-2 3 2 3M13 4.5l2 3-2 3M5 2.5l-2 10M10 2.5l2 10" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="tb" onclick="App.toggleTheme()" title="主题"><svg width="15" height="15" viewBox="0 0 15 15" fill="none"><circle cx="7.5" cy="7.5" r="5.5" stroke="currentColor" stroke-width="1.3"/><path d="M7.5 2a5.5 5.5 0 000 11V2z" fill="currentColor" opacity=".35"/></svg></button>
      <button class="tb" onclick="App._toggleTour()" title="操作指引">❔</button>
    </div>

    <div class="msgs-wrap">
      <div class="msgs" id="msgList"></div>
      <div class="scroll-track" id="scrollTrack"></div>
      <!-- Inline report viewer (sandboxed iframe) — overlays msgs-wrap only -->
      <div class="report-viewer" id="reportViewer" style="display:none">
        <div class="report-viewer-bar">
          <span class="report-viewer-title" id="reportViewerTitle">报告</span>
          <div class="report-viewer-actions">
            <button class="report-viewer-act" onclick="App.openReportInNewTab()" title="新标签页打开">↗ 新标签页</button>
            <button class="report-viewer-act" onclick="App.closeReportViewer()" title="关闭">×</button>
          </div>
        </div>
        <iframe id="reportFrame" class="report-viewer-frame" sandbox="allow-scripts allow-same-origin" referrerpolicy="no-referrer"></iframe>
      </div>
    </div>

    <div class="input-zone">
      <div class="composer" id="composer">
        <div class="composer-chips" id="composerChips"></div>
        <textarea id="input" rows="1" placeholder="分析一下液冷供应链被低估的上游标的…"></textarea>
        <div class="composer-bar">
          <button id="cmpTools" class="cmp-btn" onclick="App._toggleSkillDrawer()" title="工具（增删）">🛠 工具</button>
          <select id="modelSelect" onchange="App.setModel(this.value)"></select>
          <button id="reportsBtn" class="cmp-btn" onclick="App.openReports()" title="查看本对话生成的报告" style="display:none">↗ 报告</button>
          <button id="sendBtn" class="cmp-send" onclick="App.send()" title="发送 (Enter)">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 8h12M8 2l6 6-6 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>
      <div class="input-hint">ENTER 发送 · SHIFT+ENTER 换行 · 点 🛠 增删工具</div>
    </div>

    <!-- Market panel (v0.7) — shown only in market mode -->
    <div class="market-panel" id="marketPanel" style="display:none">
      <div class="market-panel-inner" id="marketPanelInner">
        <div class="market-empty-state">从左侧搜索或点击自选股票查看行情</div>
      </div>
    </div>

    <!-- Analysis panel (v0.9) -->
    <div class="market-panel" id="analysisPanel" style="display:none">
      <div class="market-panel-inner" id="analysisPanelInner">
        <div class="market-empty-state">从左侧搜索股票，点击"一键分析"生成结构化分析报告</div>
      </div>
    </div>

    <!-- Industry panel (v0.11) -->
    <div class="market-panel" id="industryPanel" style="display:none">
      <div class="market-panel-inner" id="industryPanelInner">
        <div class="market-empty-state">加载产业链图谱…</div>
      </div>
    </div>
    <div class="ind-drawer" id="industryDrawer"></div>
  </main>
</div>

<div class="ac-dropdown" id="acDropdown" style="display:none"></div>
<div class="gloss-panel" id="glossPanel" style="display:none"></div>
<div class="app-toast" id="appToast"></div>

<!-- Trash modal -->
<div class="modal-overlay" id="trashModal" style="display:none" onclick="if(event.target===this)App.closeTrash()">
  <div class="modal-card">
    <div class="modal-hd"><h3>回收站</h3><button class="modal-close" onclick="App.closeTrash()">×</button></div>
    <div class="modal-body" id="trashList"></div>
  </div>
</div>

<!-- Reports list modal -->
<div class="modal-overlay" id="reportsModal" style="display:none" onclick="if(event.target===this)App.closeReports()">
  <div class="modal-card reports-card">
    <div class="modal-hd"><h3>分析报告</h3><button class="modal-close" onclick="App.closeReports()">×</button></div>
    <div class="modal-body" id="reportsList"></div>
  </div>
</div>

<!-- Market search modal (v0.6) -->
<div class="modal-overlay" id="marketModal" style="display:none" onclick="if(event.target===this)App.closeMarket()">
  <div class="modal-card market-card">
    <div class="modal-hd"><h3>行情查询</h3><button class="modal-close" onclick="App.closeMarket()">×</button></div>
    <div class="modal-body">
      <input type="text" id="marketQ" placeholder="代码或名称（如 600519 / 茅台）" autocomplete="off" class="market-q-input">
      <ul id="marketResults" class="market-results"></ul>
      <div id="marketQuoteView" class="market-quote-view" style="display:none"></div>
    </div>
  </div>
</div>


<!-- Analysis graph modal -->
<div class="modal-overlay" id="graphModal" style="display:none" onclick="if(event.target===this)App.closeGraph()">
  <div class="modal-card" style="max-width:780px;max-height:85vh">
    <div class="modal-hd"><h3 id="graphModalTitle">分析关系图</h3><button class="modal-close" onclick="App.closeGraph()">×</button></div>
    <div class="modal-body" style="padding:0">
      <div id="graphChart" style="width:100%;height:500px"></div>
    </div>
  </div>
</div>

<script src="/static/lib/marked.min.js?v=28"></script>
<script src="/static/lib/echarts.min.js?v=28"></script>
<script src="/static/js/app.util.js?v=28"></script>
<script src="/static/js/app.chat-render.js?v=29"></script>
<script src="/static/js/app.core.js?v=28"></script>
<script src="/static/js/app.chat.js?v=28"></script>
<script src="/static/js/app.market.js?v=28"></script>
<script src="/static/js/app.analysis.js?v=30"></script>
<script src="/static/js/app.industry.js?v=28"></script>
<script src="/static/js/app.indicators.js?v=28"></script>
</body></html>
