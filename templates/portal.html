<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="same-origin">
  <title>DoubleH</title>
  <link rel="icon" type="image/svg+xml" sizes="any" href="/static/prism-mark.svg?v=106">
  <link rel="stylesheet" href="/static/css/portal.css?v=106">
  <script src="/static/js/portal.js?v=106" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">跳至产品入口</a>
  <div class="shell">
    <header class="header">
      <a class="brand" href="/" aria-label="DoubleH 首页"><span class="brand-mark"><svg width="23" height="23" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true" focusable="false"><use href="/static/prism-mark.svg?v=106#mark"/></svg></span><span>DoubleH</span></a>
      <span class="account" id="account" aria-live="polite"></span>
    </header>
    <main id="main" class="main">
      <div class="intro"><h1>选择工作空间</h1></div>
      <div class="notice" id="notice" role="status" hidden><span id="noticeText"></span><button type="button" id="retry">重试</button></div>
      <nav class="products" aria-label="产品入口" id="products" aria-busy="true">
        <div class="product" data-product="prism">
          <span class="product-icon prism-icon" aria-hidden="true">◈</span>
          <span class="product-copy"><strong>Prism</strong><span>研究与分析</span></span>
          <span class="product-state">正在读取</span>
        </div>
        <div class="product" data-product="work">
          <span class="product-icon work-icon" aria-hidden="true">◷</span>
          <span class="product-copy"><strong>Work</strong><span>项目、任务与日程</span></span>
          <span class="product-state">正在读取</span>
        </div>
      </nav>
    </main>
  </div>
</body>
</html>
