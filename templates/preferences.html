<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="same-origin"><title>研究偏好 · Prism</title><link rel="icon" type="image/svg+xml" sizes="any" href="/static/prism-mark.svg?v=100"><link rel="stylesheet" href="/static/css/desk.css?v=100"><script src="/static/js/app.hub.js?v=100" defer></script></head><body data-page="preferences"><a class="skip" href="#main">跳至内容</a><aside class="rail"><a class="brand" href="/prism"><svg width="0.8em" height="0.8em" viewBox="0 0 32 32" fill="var(--accent)" aria-hidden="true" focusable="false"><use href="/static/prism-mark.svg?v=100#mark"/></svg> Prism</a><nav aria-label="研究导航"><a href="/prism">研究对话</a><a href="/futures">期货研究</a><a href="/preferences">研究偏好</a></nav><div class="rail-footer"><a href="/prism?feedback=preferences">反馈与建议</a><a href="/">DoubleH</a></div></aside><main id="main"><header><h1>研究偏好</h1></header><p id="notice" class="notice" role="status" aria-live="polite" hidden></p><section class="card"><h2>风险与研究风格</h2><form id="profileForm" class="form-grid"><label>研究风格<select name="style"><option value="conservative">保守 · 优先控制损失</option><option value="balanced">均衡 · 比较风险与机会</option><option value="aggressive">积极 · 接受更高波动</option></select></label><label>关注周期<select name="horizon"><option value="short">短期</option><option value="medium">中期</option><option value="long">长期</option></select></label><label>单一标的仓位上限（%）<input name="max_position_pct" type="number" min="1" max="100" value="20" required></label><label>可接受回撤上限（%）<input name="max_drawdown_pct" type="number" min="1" max="50" value="10" required></label><label class="check"><input name="allow_leverage" type="checkbox">允许讨论杠杆策略</label><p class="wide muted">这些是你设定的研究约束，不是收益或止损保证。未提供实际持仓、资金与合约数据时，平台不会显示“风险检查通过”。</p><div class="wide actions"><button type="submit">保存偏好</button><button type="button" id="profileReload" class="secondary">重新读取</button><span id="profileVersion"></span></div></form></section><details class="card" id="portfolioDetails"><summary><strong>持仓与风险检查</strong></summary><p class="muted">价格由你填写，请自行核查来源与时间。此处填写现货证券持仓；期货合约名义金额不是市值，期货组合风险需要另行提供数据。</p><p id="portfolioNotice" role="status" aria-live="polite"></p><form id="portfolioForm" class="form-grid"><label>计价币种<select name="currency"><option>CNY</option><option>USD</option><option>HKD</option></select></label><label>记录时间<input name="observed_at" type="datetime-local" required></label><label>现金<input name="cash" inputmode="decimal" required value="0"></label><label>负债<input name="debt" inputmode="decimal" required value="0"></label><details class="wide"><summary>高级选项</summary><div class="form-grid"><label>权益高点（可选）<input name="equity_peak" inputmode="decimal"></label><label>高点时间<input name="peak_as_of" type="datetime-local"></label><label>其后净入金（入金正、出金负）<input name="net_flows_since_peak" inputmode="decimal" value="0"></label></div></details><div class="wide"><h3>持仓</h3><label class="check"><input type="checkbox" id="useObservedPriceTime" checked>价格时间使用记录时间</label><div id="positions"></div><button type="button" class="secondary" id="addPosition">添加持仓</button></div><div class="wide actions"><button type="submit" disabled>保存并检查</button><button type="button" class="secondary" id="portfolioReload">重新读取</button><span id="portfolioVersion"></span></div></form><div id="riskResults" aria-live="polite"></div></details></main></body></html>
