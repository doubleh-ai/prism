<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="same-origin"><meta name="color-scheme" content="light dark">
  <title>研究知识 · Prism</title><link rel="icon" href="/static/prism-mark.svg?v=102" type="image/svg+xml"><link rel="stylesheet" href="/static/css/desk.css?v=102"><script src="/static/js/knowledge.js?v=102" defer></script>
  <style>
    .knowledge-result{padding:18px 0;border-bottom:1px solid var(--line)}.knowledge-result button{background:transparent;border:0;color:var(--ink);padding:0;text-align:left;font-weight:600}.knowledge-result p{font-size:13px}.knowledge-source{padding:12px 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}.knowledge-detail{margin-top:24px}.knowledge-detail summary{cursor:pointer}.knowledge-status{font-size:13px;color:var(--muted)}.knowledge-detail textarea{min-height:90px}.knowledge-detail form label{display:block;margin-top:14px}.knowledge-detail details{margin-top:16px}.knowledge-detail details label{margin-top:12px}.knowledge-detail .actions{margin-top:18px}.knowledge-notice:empty{display:none}@media(prefers-color-scheme:dark){body[data-page=knowledge]{color-scheme:dark;--bg:#14191f;--surface:#1b222a;--ink:#e6ebf0;--muted:#a7b1be;--line:#35404c;--accent:#9dd6c7;--soft:#252f39;--warning:#ecc178}body[data-page=knowledge] .rail{background:var(--surface)}body[data-page=knowledge] nav a[aria-current=page]{background:var(--soft)}body[data-page=knowledge] button{color:#102f29}body[data-page=knowledge] .secondary,body[data-page=knowledge] .knowledge-result button{color:var(--ink)}body[data-page=knowledge] .notice{background:#342c1e;color:var(--warning);border-color:#70583a}}
  </style>
</head>
<body data-page="knowledge">
<a class="skip" href="#main">跳至研究知识</a>
<aside class="rail"><a class="brand" href="/prism"><svg width="0.8em" height="0.8em" viewBox="0 0 32 32" fill="var(--accent)" aria-hidden="true"><use href="/static/prism-mark.svg?v=102#mark"/></svg> Prism</a><nav aria-label="研究导航"><a href="/prism">研究对话</a><a href="/futures">期货研究</a><a href="/preferences">研究偏好</a><a href="/knowledge" aria-current="page">研究知识</a></nav><div class="rail-footer"><a href="/">DoubleH</a></div></aside>
<main id="main"><header><h1>研究知识</h1></header>
<p id="notice" class="notice" role="status" aria-live="polite" hidden></p>
<form id="searchForm" class="actions"><label for="query">搜索研究结论<input id="query" type="search" maxlength="200" autocomplete="off"></label><button type="submit">搜索</button></form>
<section aria-label="搜索结果"><div id="results" aria-live="polite"></div><p class="muted" id="empty" hidden>没有找到研究结论。</p><button type="button" class="secondary" id="more" hidden>加载更多</button></section>
<section id="detail" class="card knowledge-detail" hidden aria-labelledby="detailTitle"><div class="actions"><h2 id="detailTitle">结论</h2><button type="button" class="secondary" id="close">关闭</button></div><p id="statement"></p><p class="knowledge-status" id="metadata"></p><p id="limitations" class="muted"></p><h3>原始证据</h3><div id="sources"></div><p><a id="report" hidden>查看原研究</a></p><details><summary>复核记录</summary><div id="history"></div></details>
<form id="reviewForm"><label>复核结果<select id="state"><option value="reviewed">已复核</option><option value="disputed">有争议</option><option value="retracted">撤回</option></select></label><label>理由模板<select id="reasonTemplate"><option value="">自行填写</option><option value="已核对原始证据与结论。">已核对原始证据</option><option value="证据不足或存在不同解释。">证据不足或存在不同解释</option><option value="原结论已不再适用。">原结论已不再适用</option></select></label><label>复核说明<textarea id="note" maxlength="4000"></textarea></label><details><summary>高级选项</summary><label id="untilLabel">有效期至（本地时间）<input id="until" type="datetime-local"></label><label id="replacementLabel" hidden>替代结论 ID（可选）<input id="replacement" maxlength="200"></label></details><p id="reviewNotice" class="knowledge-notice" role="status" aria-live="polite"></p><div class="actions"><button type="submit">保存复核</button><button type="button" class="secondary" id="reload">重新读取</button></div></form></section>
</main></body></html>
