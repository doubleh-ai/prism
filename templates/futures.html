<!doctype html>
<html lang="zh-CN" class="light" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>期货研究 · Prism</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('cl-theme');
        var dark = t ? t === 'dark' : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.className = dark ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      } catch (e) {}
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="/static/prism-mark.svg?v=143">
  <link rel="stylesheet" href="/static/css/portal.css?v=143">
  <link rel="stylesheet" href="/static/css/futures.css?v=143">
  <link rel="stylesheet" href="/static/css/copilot.css?v=143">
  <script src="/static/js/futures-brief.js?v=143" defer></script>
  <script src="/static/js/futures.js?v=143" defer></script>
  <script src="/static/js/futures-copilot.js?v=143" defer></script>
</head>
<body class="futures-with-rail">
  <a class="skip-link" href="#main">跳至主要内容</a>

  <div class="futures-shell" id="futuresShell">
    <nav class="icon-rail" id="iconRail" aria-label="研究空间导航">
      <a class="icon-rail-brand" href="/prism" title="Prism 投研工作台">
        <svg width="28" height="28" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true" focusable="false"><use href="/static/prism-mark.svg?v=143#mark"/></svg>
        <span class="rail-brand-word">Prism<small>投研工作台</small></span>
      </a>

      <span class="rail-section-label">研究空间</span>
      <a class="icon-rail-btn" href="/prism?mode=market" title="行情工作区">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 19V5m0 14h16M8 15.5l3-4 3 2.2 4.5-6.2" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="rail-label">行情工作区</span>
      </a>
      <a class="icon-rail-btn active" href="/futures" aria-current="page" title="期货研究">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 17L17 7M9.5 7H17v7.5" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="rail-label">期货研究</span>
      </a>
      <a class="icon-rail-btn" href="/prism?mode=reports&tab=journal" title="研究与复盘">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 3.5h8l4 4V20H6V3.5z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M14 3.5V8h4M9 12h6M9 15.5h4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <span class="rail-label">研究与复盘</span>
      </a>

      <span class="rail-section-label rail-section-second">筛选与验证</span>
      <a class="icon-rail-btn" href="/prism?mode=screener" title="全市场选股">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 7h9m4 0h3M13 5v4M4 12h4m4 0h8M8 10v4M4 17h11m4 0h1M15 15v4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <span class="rail-label">全市场选股</span>
      </a>
      <a class="icon-rail-btn" href="/prism?mode=indicators" title="指标实验室">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15.5 4.5c-2.1 0-3 1.3-3.4 3.6l-1.2 7.8c-.4 2.3-1.3 3.6-3.4 3.6M8.5 10.5h6.5" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="rail-label">指标实验室</span>
      </a>

      <div class="rail-foot">
        <button type="button" class="rail-collapse-btn" id="futuresRailCollapseBtn" title="收起或展开主导航栏">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path class="rail-chevron-path" d="M14.5 6.5L9 12l5.5 5.5M19 6.5L13.5 12 19 17.5" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="rail-label">收起导航</span>
        </button>
      </div>
    </nav>

    <div class="futures-shell-main">
      <header class="topbar futures-topbar">
        <div class="workbench-page-title futures-topbar-title">
          <h1>期货研究</h1>
          <a id="all-futures" class="futures-back-pill" href="/futures" hidden>全部品种</a>
        </div>
        <div class="futures-topbar-actions">
          <button type="button" class="copilot-pill-btn" id="futuresTopPersonaBtn" title="管理我的独立投研画像与风控纪律">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="8.5" r="3.5" stroke="currentColor" stroke-width="1.7"/><path d="M5.5 19.5c1.4-3 3.8-4.5 6.5-4.5s5.1 1.5 6.5 4.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
            <span>投研画像</span>
          </button>
          <button type="button" class="tb" id="futuresThemeBtn" title="切换明暗主题" aria-label="切换明暗主题">
            <svg width="15" height="15" viewBox="0 0 15 15" fill="none"><circle cx="7.5" cy="7.5" r="5.5" stroke="currentColor" stroke-width="1.3"/><path d="M7.5 2a5.5 5.5 0 000 11V2z" fill="currentColor" opacity=".35"/></svg>
          </button>
          <button type="button" id="futures-help-btn" class="tb" aria-label="功能与能力指引" title="功能与能力指引">?</button>
        </div>
      </header>

      <main id="main" class="main futures-main" tabindex="-1">
        <header class="futures-heading">
          <div>
            <p id="futures-meta" class="futures-meta" hidden></p>
            <h2 id="futures-title" class="futures-page-h2">期货极值与因果看盘</h2>
          </div>
          <label id="futures-search-label" class="futures-search-box" hidden>
            <span class="sr-only">搜索品种</span>
            <input id="futures-search" type="search" name="prism_futures_filter" inputmode="search" placeholder="搜索品种名称、代码或交易所…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-lpignore="true" data-1p-ignore="true" data-form-type="other">
          </label>
        </header>
        <aside id="futures-guide-banner" class="futures-guide-banner" aria-label="首次使用指引" hidden>
          <p class="futures-guide-banner-text"><strong>初次使用期货工作台？</strong>后台每 30 分钟自动巡检异动与对账 · 打开即看近 5 年分位、产业利润与期股联动。</p>
          <div class="futures-guide-banner-actions">
            <button type="button" id="futures-guide-start" class="futures-guide-start">查看指引</button>
            <button type="button" id="futures-guide-dismiss" class="futures-guide-dismiss">知道了</button>
          </div>
        </aside>
        <p id="futures-status" role="status">正在读取…</p>
        <button type="button" id="futures-retry" hidden>重试</button>
        <div id="futures-content" data-account="__FUTURES_ACCOUNT__" aria-busy="true"></div>
        __FUTURES_BOOTSTRAP__
        __FUTURES_JOURNAL__
      </main>
    </div>
  </div>
</body>
</html>
