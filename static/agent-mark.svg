<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" rx="8" fill="#0E1B15"/>

  <!-- Back Orbit (+45 deg, Deep Forest Jade) -->
  <ellipse cx="16" cy="16" rx="11.2" ry="5.1" transform="rotate(45 16 16)" stroke="#357A5E" stroke-width="2.15"/>

  <!-- Negative-space weave cuts at top & bottom crossings before Front Orbit -->
  <circle cx="16" cy="9.4" r="2.2" fill="#0E1B15"/>
  <circle cx="16" cy="22.6" r="2.2" fill="#0E1B15"/>

  <!-- Front Orbit (-45 deg, Mint Jade) -->
  <ellipse cx="16" cy="16" rx="11.2" ry="5.1" transform="rotate(-45 16 16)" stroke="#72CCA1" stroke-width="2.15"/>

  <!-- Over-weave arc of Back Orbit at left crossing for true Mobius interlock -->
  <circle cx="9.4" cy="16" r="2.1" fill="#0E1B15"/>
  <path d="M8.1 14.3C8.8 15.4 9.7 16.5 10.8 17.5" stroke="#357A5E" stroke-width="2.15" stroke-linecap="round"/>

  <!-- Orbital Pulse Node (Top-Right Apex, Ice Ivory with negative-space collar) -->
  <circle cx="23.5" cy="8.5" r="3.1" fill="#0E1B15"/>
  <circle cx="23.5" cy="8.5" r="1.95" fill="#ECF6F0"/>

  <!-- Stepped Two-Tone Faceted Core (matching favicon.svg flat facet language) -->
  <path d="M16 11.8L20.2 16L16 20.2L11.8 16L16 11.8Z" fill="#ECF6F0"/>
  <path d="M16 11.8L20.2 16L16 20.2V11.8Z" fill="#72CCA1" fill-opacity="0.45"/>
</svg>
