# Pre-commit hooks — install with `pre-commit install` after
# `pip install pre-commit`. Runs ruff, format check, and a quick
# smoke import.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        files: ^(server|tests)/.*\.py$
      - id: ruff-format
        files: ^(server|tests)/.*\.py$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: detect-private-key
        # Don't scan the secret_key file or config
        exclude: ^(data/|config/)
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: local
    hooks:
      - id: pytest-fast
        name: pytest (fast subset)
        entry: python -m pytest tests/ -x -q -m "not integration"
        language: system
        pass_filenames: false
        types: [python]
