name: Bug Report
description: 报告程序缺陷、界面异常或数据口径问题
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 清晰描述你遇到的异常现象，以及预期的正确行为。
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 列出最小复现步骤（请勿包含密码、API Key 或真实生产数据）。
      placeholder: |
        1. 进入 `/prism` 或 `/futures`
        2. 执行某项操作
        3. 观察到的现象 / 报错日志
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本与环境
      description: 例如 `v0.26.1`、Python 3.12、操作系统与浏览器版本。
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已确认提交内容不包含 API Key、密码、Cookie 或私有服务器地址。
          required: true
