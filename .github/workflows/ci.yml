# Prism — CI
#
# Runs on every push and PR. The pipeline is intentionally small:
# the heavy lifting (running the actual Claude Code CLI, hitting the
# deployed server) is done manually or in a separate workflow.
name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main, codex/prism-production-v0.19.7, codex/prism-agent-workbench, codex/prism-release-control]

permissions:
  contents: read

# Obsolete checks may stop; production writers use a separate serialized executor.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node for real browser-script regression tests
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-extra.txt

      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip==26.1.2
          python -m pip install -r requirements.txt -r requirements-extra.txt ruff==0.17.1

      - name: Lint
        run: |
          ruff check server/ tests/ scripts/release_candidate.py scripts/release_controller.py scripts/remote_release.py scripts/secure_backup.py scripts/verify_backup_boot.py scripts/verify_database_compatibility.py scripts/build_jsonpath_wheel.py
          ruff format --check server/ tests/ scripts/release_candidate.py scripts/release_controller.py scripts/remote_release.py scripts/secure_backup.py scripts/verify_backup_boot.py scripts/verify_database_compatibility.py scripts/build_jsonpath_wheel.py

      - name: Run tests with coverage
        env:
          PRISM_LOG_LEVEL: WARNING
        run: |
          pytest tests/ \
            --cov=server \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=45 \
            -v

  security-scan:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip==26.1.2
          python -m pip install pip-audit==2.10.1

      - name: Audit dependencies
        run: python -m pip_audit -r requirements.txt -r requirements-extra.txt --strict
